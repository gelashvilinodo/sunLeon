<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/aac57e02c4.js"
      crossorigin="anonymous"
    ></script>
    <title>SUNLE☀️N</title>
  </head>
  <body>
    <div class="product_container">
      <div id="header"></div>
      <div class="products_header">
        <div class="products_header_top">
          <h2 class="category_title"></h2>
          <select id="sort-select">
            <option value="name-asc" data-sort="name_asc"></option>
            <option value="name-desc" data-sort="name_desc"></option>
            <option value="price-asc" data-sort="price_asc"></option>
            <option value="price-desc" data-sort="price_desc"></option>
          </select>
        </div>
        <p class="products_count"></p>
      </div>
      <div class="divider"></div>
      <section class="products_section"></section>
    </div>
    <footer id="footer"></footer>
    <script src="common.js"></script>
    <script src="products.js"></script>
  </body>
</html>
